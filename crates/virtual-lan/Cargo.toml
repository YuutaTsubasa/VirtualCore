[package]
name = "virtual-lan"
version = "0.6.0"
description = "Virtual 系列共用的區網房間伺服器（axum WebSocket＋網頁靜態檔），房間邏輯在 virtual-room"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
virtual-room = { path = "../virtual-room" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rand = "0.8"
