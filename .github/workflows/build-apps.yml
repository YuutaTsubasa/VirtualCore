# Virtual 系列共用的「各平台 App 打包」（可重用 workflow）。遊戲 repo 這樣呼叫：
#
#   on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
#   permissions: { contents: write }
#   jobs:
#     build:
#       uses: YuutaTsubasa/VirtualCore/.github/workflows/build-apps.yml@v0.1.0
#       secrets: inherit   # ANDROID_KEYSTORE_BASE64 等簽章 secrets
#       with:
#         app-name: VirtualVolleyballKing
#         wasm-crate: volleyball-wasm
#         web-url: https://yuuta-tsubasa.studio/VirtualVolleyball/
#
#   手動：Actions → Build apps → Run workflow（檔案在該次執行的 Artifacts）
#   推 v* 標籤：打包完自動附到同名的 Release
#
# 產出：
#   Windows  .exe（NSIS）、.msi
#   Linux    .deb、.rpm、.AppImage
#   macOS    .dmg（Apple Silicon、Intel 各一）
#   Android  .apk（已簽章，可直接安裝）
#   iOS      模擬器用 .app（實機安裝需要 Apple 開發者帳號）
#
# 都沒有程式碼簽章／公證（Windows SmartScreen、macOS Gatekeeper 會跳警告）。
name: Build apps

on:
  workflow_call:
    inputs:
      app-name:
        description: 安裝檔檔名的前綴，例如 VirtualVolleyballKing
        type: string
        required: true
      wasm-crate:
        description: crates/ 底下的 WebAssembly crate 資料夾名稱，例如 volleyball-wasm
        type: string
        required: true
      web-url:
        description: 網頁版網址（App 版大廳的分享連結指向這裡）
        type: string
        required: true
      key-alias:
        description: 沒有簽章 secrets 時臨時金鑰的別名
        type: string
        default: virtual
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

env:
  VITE_WEB_URL: ${{ inputs.web-url }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: wasm32-unknown-unknown
            args: ''
          - name: Linux
            os: ubuntu-22.04
            rust-targets: wasm32-unknown-unknown
            args: ''
          # 通用版（universal）會找不到第二個執行檔（區網伺服器），所以兩種 CPU 分開打包
          - name: macOS-AppleSilicon
            os: macos-latest
            rust-targets: wasm32-unknown-unknown,aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS-Intel
            os: macos-latest
            rust-targets: wasm32-unknown-unknown,x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 套件鏡像偶爾會卡住不動：每次最多等 5 分鐘，失敗就重試（最多 3 次）
      - name: Linux 相依套件
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: |
          # timeout 放在 sudo 裡面才殺得到 apt-get；apt 本身也設網路逾時與重試
          APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          for i in 1 2 3; do
            sudo timeout -k 10 300 apt-get $APT update &&             sudo timeout -k 10 300 apt-get $APT install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt-get 失敗或逾時，重試第 $i 次"; sleep 10
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/${{ inputs.wasm-crate }}

      - run: npm ci

      # beforeBuildCommand 是 npm run build，會先用 wasm-pack 產生單機版引擎
      - run: npx tauri build ${{ matrix.args }}

      - name: 收集安裝檔
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub 的 Ubuntu runner 已內建 Android SDK 與 NDK，直接拿來用
      - name: Android SDK／NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/${{ inputs.wasm-crate }}

      - run: npm ci

      # src-tauri/gen 不進版控，每次依 tauri.conf.json 產生 Android 專案
      - run: npx tauri android init --ci
      # init 產生的專案用的是 Tauri 預設圖示，換成我們的
      - run: npx tauri icon src-tauri/icons/icon.png

      - run: npx tauri android build --apk

      # 有設定 ANDROID_KEYSTORE_BASE64 等 secrets 就用固定的金鑰簽章（之後可以直接覆蓋安裝升級）；
      # 沒有的話用這次臨時產生的金鑰（能安裝，但升級時要先移除舊版）。
      - name: 簽章
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$BUILD_TOOLS"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            KEYSTORE_PASSWORD=ci-temporary
            KEY_ALIAS=${{ inputs.key-alias }}
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=${{ inputs.app-name }}"
          fi
          mkdir -p out
          APK=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -1)
          echo "unsigned: $APK"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --out "out/${{ inputs.app-name }}_${GITHUB_REF_NAME//\//-}_android.apk" aligned.apk
          "$BT/apksigner" verify out/*.apk
          rm -f out/*.idsig   # v4 簽章的附檔，一般安裝用不到
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: out/*
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/${{ inputs.wasm-crate }}

      - run: npm ci

      - run: npx tauri ios init --ci
      # init 產生的專案用的是 Tauri 預設圖示，換成我們的
      - run: npx tauri icon src-tauri/icons/icon.png

      # 沒有 Apple 開發者帳號只能做模擬器版；實機版需要簽章（見 README）
      - run: npx tauri ios build --target aarch64-sim --debug

      - name: 收集 .app
        run: |
          mkdir -p out
          APP=$(find src-tauri/gen/apple/build -name '*.app' -type d -prune | head -1)
          echo "app: $APP"
          ditto -c -k --keepParent "$APP" "out/${{ inputs.app-name }}_${GITHUB_REF_NAME//\//-}_ios-simulator.app.zip"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator
          path: out/*
          if-no-files-found: error
